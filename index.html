<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>북방의 거인들: AI 역사 인터뷰</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1a237e;
    }

    .subtitle {
      text-align: center;
      color: #546e7a;
      margin-bottom: 24px;
      font-size: 14px;
    }

    /* 인증(Auth) 박스 스타일 */
    .auth-container {
      max-width: 400px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .auth-box input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .auth-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .auth-btn-row button {
      flex: 1;
    }

    /* 사용자 프로필 바 */
    .user-profile-bar {
      background: #e8eaf6;
      padding: 12px 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .info {
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 14px;
      line-height: 1.6;
    }

    .option-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    select, input {
      height: 44px;
      padding: 0 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      font-family: Arial, sans-serif;
    }

    textarea:focus, select:focus, input:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    .label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 15px;
      color: #263238;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, .download-link {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .download-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .make-btn { background: #42a5f5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .refresh-btn { background: #66bb6a; color: white; margin-bottom: 16px; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }
    .login-btn { background: #1a237e; color: white; }
    .signup-btn { background: #eceff1; color: #37474f; border: 1px solid #cfd8dc; }
    .logout-btn { background: #e53935; color: white; height: 34px; padding: 0 12px; font-size: 12px; }
    .download-link { background: #00acc1; color: white; }

    .hidden { display: none !important; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: #3949ab;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }

    .result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .chat-display {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 8px;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    audio { width: 100%; margin-top: 10px; }
    .list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    
    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title { margin: 0 0 6px; font-size: 17px; font-weight: bold; color: #1a237e; }
    .item-content { margin: 0; color: #455a64; line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 11px; color: #90a4ae; }
    .item-actions { display: flex; gap: 8px; }
    .edit-box { display: grid; grid-template-columns: 1fr 2fr auto auto; gap: 8px; width: 100%; }
    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }

    @media (max-width: 700px) {
      .option-box, .edit-box { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
      .button-row, .item-actions { justify-content: stretch; }
      button, .download-link { width: 100%; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>

  <div id="authContainer" class="auth-container">
    <h2 style="color:#1a237e; margin-bottom:5px;">사관 청사 입정</h2>
    <p style="font-size:12px; color:#666; margin-bottom:20px;">역사를 기록하기 위해 인증이 필요합니다.</p>
    <div class="auth-box">
      <input id="authEmail" type="email" placeholder="이메일 주소 (example@email.com)" />
      <input id="authPassword" type="password" placeholder="비밀번호 (6자리 이상)" />
      <div class="auth-btn-row">
        <button class="signup-btn" id="signUpBtn">회원가입</button>
        <button class="login-btn" id="logInBtn">로그인</button>
      </div>
    </div>
  </div>

  <div id="mainContainer" class="container hidden">
    <h1>북방의 거인들</h1>
    <div class="subtitle">고구려와 발해의 영웅들을 AI 인터뷰와 목소리로 만나다</div>

    <div class="user-profile-bar">
      <div>접속 사관: <strong id="currentUserEmail" style="color:#1a237e;">-</strong></div>
      <button class="logout-btn" id="logOutBtn">로그아웃</button>
    </div>

    <div class="info">
      역사적 인물을 고르고 질문을 입력하면 AI 인터뷰 답변과 함께 생생한 음성을 들을 수 있습니다.<br />
      완성된 답변은 아래 '사초(역사 기록)' 보관소에 안전하게 기록(Firebase DB)하고 관리할 수 있습니다.
    </div>

    <div class="option-box">
      <div>
        <div class="label">인터뷰 대상 선택</div>
        <select id="personaSelect">
          <option value="고구려의 광개토대왕이야. 위엄 있고 당당한 말투로 고구려의 기상과 영토 확장에 대해 답변해줘.">고구려 - 광개토대왕</option>
          <option value="발해를 건국한 대조영이야. 고구려를 계승한 자부심을 담아 완강하고 굳건하게 답변해줘.">발해 - 대조영</option>
        </select>
      </div>
      <div>
        <div class="label">말투 속도</div>
        <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" placeholder="속도" />
      </div>
    </div>

    <div>
      <div class="label">인물에게 보낼 질문</div>
      <textarea id="questionInput" placeholder="역사 속 주인공에게 궁금한 점을 질문하세요... (예: 백성을 다스릴 때 가장 중요하게 생각한 가치는 무엇입니까?)"></textarea>
    </div>

    <div class="button-row">
      <button class="clear-btn" id="clearBtn">초기화</button>
      <button class="make-btn" id="makeBtn">질문 전송 및 음성 듣기</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultBox" class="result-box hidden">
      <div class="label" id="answerTitle">인터뷰 답변 기록</div>
      <div id="answerBox" class="chat-display"></div>
      <audio id="audioPlayer" controls></audio>
      <div class="button-row">
        <a id="downloadLink" class="download-link hidden" href="#" download="interview.mp3">mp3 다운로드</a>
        <button class="save-btn" id="saveBtn">이 대화를 사초(DB)에 기록하기</button>
      </div>
    </div>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #cfd8dc;" />

    <div>
      <h3 style="color:#1a237e; margin-bottom:10px;">나의 사초 (역사 기록 보관소)</h3>
      <button class="refresh-btn" onclick="loadData()">사초 새로고침</button>
      <div id="dataList" class="list"></div>
    </div>
  </div>

  <script>
    // 💡 전달해주신 본인의 Firebase Web 앱 실제 키값이 완벽 주입되었습니다!
    const firebaseConfig = {
      apiKey: "AIzaSyDTKTX3tTAaSAecMkvEzevbuRQmwuRaDWo",
      authDomain: "suhang-86f3f.firebaseapp.com",
      databaseURL: "https://suhang-86f3f-default-rtdb.firebaseio.com",
      projectId: "suhang-86f3f",
      storageBucket: "suhang-86f3f.firebasestorage.app",
      messagingSenderId: "412517168949",
      appId: "1:412517168949:web:26766fd1b37b3fbd4f7e7c",
      measurementId: "G-YDVD63CF7H"
    };
    
    // Firebase 초기화 진행
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoM0bZsWJ4lES4EXSx09myjz08T2akHlYavU3ZqBWmLZEZrTUIgpt3TPlW67UYC2EPrg/exec';
    const DATABASE_URL = firebaseConfig.databaseURL;
    const DATA_PATH = 'items';
    const USER_PATH = 'users';

    // UI 엘리먼트 수집
    const authContainer = document.getElementById('authContainer');
    const mainContainer = document.getElementById('mainContainer');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const signUpBtn = document.getElementById('signUpBtn');
    const logInBtn = document.getElementById('logInBtn');
    const logOutBtn = document.getElementById('logOutBtn');
    const currentUserEmail = document.getElementById('currentUserEmail');

    const questionInput = document.getElementById('questionInput');
    const personaSelect = document.getElementById('personaSelect');
    const speedInput = document.getElementById('speedInput');
    const makeBtn = document.getElementById('makeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const answerBox = document.getElementById('answerBox');
    const answerTitle = document.getElementById('answerTitle');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const dataList = document.getElementById('dataList');

    let currentAnswerText = ""; 
    let loggedInUser = null; 

    // 인증 핸들러 등록
    signUpBtn.addEventListener('click', handleSignUp);
    logInBtn.addEventListener('click', handleLogIn);
    logOutBtn.addEventListener('click', handleLogOut);

    // 인터뷰 코어 기능 핸들러 등록
    makeBtn.addEventListener('click', startInterview);
    clearBtn.addEventListener('click', clearPage);
    saveBtn.addEventListener('click', addFirebaseData);

    questionInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && event.ctrlKey) {
        startInterview();
      }
    });

    function getEndpoint(path = '') {
      const cleanPath = path ? `/${path}` : '';
      return `${DATABASE_URL}/${DATA_PATH}${cleanPath}.json`;
    }

    function getUserEndpoint(uid = '') {
      const cleanPath = uid ? `/${uid}` : '';
      return `${DATABASE_URL}/${USER_PATH}${cleanPath}.json`;
    }

    /* 🔐 회원가입 */
    async function handleSignUp() {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();

      if(!email || !password) { alert('이메일과 비밀번호를 모두 입력하세요.'); return; }
      
      try {
        await auth.createUserWithEmailAndPassword(email, password);
        alert('사관 임명이 완료되었습니다! 자동으로 로그인 처리됩니다.');
      } catch (error) {
        console.error(error);
        alert('회원가입 오류: ' + error.message);
      }
    }

    /* 🔐 로그인 */
    async function handleLogIn() {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();

      if(!email || !password) { alert('이메일과 비밀번호를 모두 입력하세요.'); return; }

      try {
        await auth.signInWithEmailAndPassword(email, password);
        alert('청사에 정상적으로 입정하셨습니다.');
      } catch (error) {
        console.error(error);
        alert('로그인 오류: ' + error.message);
      }
    }

    /* 🔐 로그아웃 */
    async function handleLogOut() {
      try {
        await auth.signOut();
        alert('안전하게 퇴정 처리되었습니다.');
        clearPage();
      } catch (error) {
        alert('로그아웃 수행 오류');
      }
    }

    /* 🔐 인증 상태 모니터링 체계 (onAuthStateChanged) */
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        loggedInUser = user;
        currentUserEmail.textContent = user.email;
        
        authContainer.classList.add('hidden');
        mainContainer.classList.remove('hidden');
        
        authEmail.value = "";
        authPassword.value = "";

        // 💡 로그인 성공하는 즉시 Realtime Database의 'users' 노드 하위에 유저 데이터 기록
        try {
          const syncData = {
            uid: user.uid,
            email: user.email,
            lastLogin: new Date().toLocaleString('ko-KR')
          };
          await fetch(getUserEndpoint(user.uid), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(syncData)
          });
        } catch(e) { console.error("Realtime DB 유저 갱신 실패", e); }

        loadData();
      } else {
        loggedInUser = null;
        authContainer.classList.remove('hidden');
        mainContainer.classList.add('hidden');
        dataList.innerHTML = '';
      }
    });

    /* 📜 기능 로직: 역사 인물 인터뷰 진행 */
    async function startInterview() {
      if (!loggedInUser) { alert('세션이 유효하지 않습니다. 다시 로그인하세요.'); return; }
      
      const question = questionInput.value.trim();
      const persona = personaSelect.value;
      const selectedName = personaSelect.options[personaSelect.selectedIndex].text;
      const speed = Number(speedInput.value || 1.0);

      if (!question) { alert('인물에게 던질 질문을 채워주세요.'); return; }

      audioPlayer.removeAttribute('src');
      audioPlayer.classList.add('hidden');
      downloadLink.classList.add('hidden');

      // 💡 [선제 조치] 에러 유무 상관없이 질문 내용을 사초에 먼저 실시간 적재 (인증 유저 정보 포함)
      try {
        setLoading(true);
        resultBox.classList.add('hidden');
        statusBox.textContent = '사초에 질문 기록을 적는 중...';
        
        const backupItem = {
          title: `${selectedName}에 대한 질문`,
          content: `[질문 내용]: ${question}\n(※ AI 답변 수신 전 대기 중 혹은 에러)`,
          author: loggedInUser.email,
          authorUid: loggedInUser.uid,
          createdAt: new Date().toLocaleString('ko-KR')
        };
        
        await fetch(getEndpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(backupItem)
        });
        await loadData();
      } catch (fbError) { console.error("임시 백업 적재 실패", fbError); }

      // OpenAI 챗봇 연동 및 텍스트 송수신
      try {
        statusBox.textContent = `${selectedName} 장군에게 전령을 보냈습니다. 답변을 기다리는 중...`;

        const chatResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ type: 'chat', persona: persona, question: question })
        });

        const chatData = await chatResponse.json();
        if (chatData.error) throw new Error(chatData.error);
        if (!chatData.answer) throw new Error('답변 데이터 유실');

        currentAnswerText = chatData.answer;
        answerTitle.textContent = `📜 ${selectedName}의 답변`;
        answerBox.textContent = currentAnswerText;

        // TTS 음성 변환 엔진 호출
        statusBox.textContent = '목소리를 조율하여 불러오는 중입니다...';
        const ttsResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ type: 'tts', text: currentAnswerText, speed: speed })
        });

        const ttsData = await ttsResponse.json();
        if (ttsData.error) throw new Error(ttsData.error);
        
        if (ttsData.audioBase64) {
          const audioUrl = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');
          audioPlayer.src = audioUrl;
          audioPlayer.classList.remove('hidden');
          downloadLink.href = audioUrl;
          downloadLink.download = `interview-${selectedName}.mp3`;
          downloadLink.classList.remove('hidden');
          audioPlayer.play();
        }

        resultBox.classList.remove('hidden');
        statusBox.textContent = '인터뷰 프로토콜이 완료되었습니다.';
      } catch (error) {
        console.error(error);
        statusBox.textContent = '교신 실패 (오류 발생)';
        currentAnswerText = `[시스템 안내]: OpenAI API 연동 실패.\n원인: ${error.message}\n\n질문 본문:\n${question}`;
        answerTitle.textContent = `⚠️ 통신 차단됨 (${selectedName})`;
        answerBox.textContent = currentAnswerText;
        resultBox.classList.remove('hidden');
      } finally {
        setLoading(false);
      }
    }

    /* 💡 최종 답변 저장 */
    async function addFirebaseData() {
      if (!loggedInUser) return;
      const selectedName = personaSelect.options[personaSelect.selectedIndex].text;
      if (!currentAnswerText) return;

      const newItem = {
        title: selectedName, 
        content: currentAnswerText, 
        author: loggedInUser.email,
        authorUid: loggedInUser.uid,
        createdAt: new Date().toLocaleString('ko-KR')
      };

      try {
        statusBox.textContent = '사초 기록 보관 절차 진행 중...';
        await fetch(getEndpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newItem)
        });
        alert('역사 보관소(DB)에 안전하게 기록 수록되었습니다.');
        await loadData();
      } catch (error) { alert('Firebase 저장 실패'); }
    }

    /* 💡 Realtime Database 사초 전체 로드 */
    async function loadData() {
      try {
        const response = await fetch(getEndpoint());
        const data = await response.json();
        renderData(data);
      } catch (error) {
        dataList.innerHTML = '<div class="empty">데이터 로드에 실패했습니다.</div>';
      }
    }

    /* 💡 특정 기록 폐기(삭제) */
    async function deleteData(id) {
      if (!confirm('해당 기록을 영구히 결단(삭제)하시겠습니까?')) return;
      try {
        await fetch(getEndpoint(id), { method: 'DELETE' });
        await loadData();
      } catch (error) { alert('삭제 처리에 실패했습니다.'); }
    }

    /* 💡 기록 정보 수정 */
    async function updateData(id) {
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();

      if (!editTitle || !editContent) { alert('모든 칸을 채워넣어 주세요.'); return; }

      const updatedItem = {
        title: editTitle,
        content: editContent,
        updatedAt: new Date().toLocaleString('ko-KR')
      };

      try {
        await fetch(getEndpoint(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedItem)
        });
        await loadData();
      } catch (error) { alert('수정 처리에 실패했습니다.'); }
    }

    /* 💡 화면에 역사 리스트 드로잉 */
    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) { dataList.innerHTML = '<div class="empty">보관된 역사 기록이 존재하지 않습니다.</div>'; return; }

      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')} <span style="font-size:11px; color:#7e57c2; font-weight:normal;">[사관: ${escapeHTML(item.author || '익명 사관')}]</span></p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">기록일: ${item.createdAt || '-'} ${item.updatedAt ? ` / 수정일: ${item.updatedAt}` : ''}</div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    function showEditForm(id, title, content) {
      const itemBox = document.getElementById(`item-${id}`);
      itemBox.innerHTML = `
        <div class="edit-box">
          <input id="edit-title-${id}" type="text" value="${title}" />
          <input id="edit-content-${id}" type="text" value="${content}" />
          <button class="save-btn" onclick="updateData('${id}')">저장</button>
          <button class="cancel-btn" onclick="loadData()">취소</button>
        </div>
      `;
    }

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) { byteNumbers[i] = slice.charCodeAt(i); }
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    
    function escapeForAttribute(text) { return escapeHTML(text).replaceAll('`', '&#096;'); }
    
    function setLoading(isLoading) {
      makeBtn.disabled = isLoading;
      makeBtn.textContent = isLoading ? '장군과 소통 중...' : '질문 전송 및 음성 듣기';
    }

    function clearPage() {
      questionInput.value = '';
      statusBox.textContent = '';
      currentAnswerText = "";
      audioPlayer.removeAttribute('src');
      audioPlayer.classList.add('hidden');
      downloadLink.href = '#';
      downloadLink.classList.add('hidden');
      resultBox.classList.add('hidden');
    }
  </script>
</body>
</html>

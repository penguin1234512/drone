<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>북방의 거인들: AI 역사 인터뷰</title>
    <style>
        /* 기본 스타일 및 레이아웃 [3-5] */
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: Arial, sans-serif; color: #333; }
        .container { width: min(900px, 92%); margin: 40px auto; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.16); }
        h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
        .hidden { display: none; }
        
        /* 로그인 섹션 스타일 [6, 7] */
        .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        input, select, textarea { width: 100%; height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; outline: none; }
        textarea { min-height: 100px; padding: 12px; resize: vertical; }
        button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; cursor: pointer; font-weight: bold; transition: 0.15s; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .login-btn { background: #42a5f5; color: white; }
        .signup-btn { background: #7e57c2; color: white; }
        
        /* 메인 콘텐츠 스타일 [8-10] */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f7f9fb; padding: 14px; border-radius: 16px; margin-bottom: 20px; }
        .chat-box { border: 1px solid #edf1f5; background: #f7f9fb; border-radius: 18px; padding: 18px; min-height: 150px; margin-bottom: 20px; line-height: 1.7; white-space: pre-wrap; }
        .history-list { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
        .history-item { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>북방의 거인들</h1>
    <div class="subtitle">고구려와 발해의 인물을 AI로 만나보세요</div>

    <!-- 로그인 섹션 [11] -->
    <section id="authSection">
        <div class="auth-box">
            <h2>사관 로그인</h2>
            <input id="emailInput" type="email" placeholder="이메일" />
            <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
            <button class="login-btn" id="loginBtn">사관 입장 (로그인)</button>
            <button class="signup-btn" id="signupBtn">새 사관 등록 (회원가입)</button>
        </div>
    </section>

    <!-- 메인 섹션 [12] -->
    <section id="mainSection" class="hidden">
        <div class="top-bar">
            <div class="user-info">접속 사관: <strong id="userEmail"></strong></div>
            <button class="logout-btn" id="logoutBtn" style="background:#455a64; color:white;">기록 종료</button>
        </div>

        <div class="interview-setup">
            <h3>인터뷰 대상 선택</h3>
            <select id="personaSelect" style="margin-bottom: 10px;">
                <option value="고구려의 광개토대왕이야. 위엄 있고 정복 전쟁에 자부심이 있는 말투로 대답해줘.">고구려 - 광개토대왕</option>
                <option value="발해를 건국한 대조영이야. 고구려의 기상을 이어받아 나라를 세운 굳건한 말투로 대답해줘.">발해 - 대조영</option>
            </select>
            <textarea id="questionInput" placeholder="질문을 입력하세요 (예: 나라를 세우실 때 가장 힘들었던 점은 무엇인가요?)"></textarea>
            <button id="askBtn" class="login-btn" style="width:100%; margin-top:10px;">질문하기</button>
        </div>

        <div id="status" style="margin: 10px 0; font-size: 14px; color: #666;"></div>
        
        <h3>대화 내용</h3>
        <div id="answerBox" class="chat-box">아직 대화가 없습니다.</div>
        
        <audio id="audioPlayer" controls class="hidden" style="width:100%; margin-bottom:20px;"></audio>

        <button id="saveBtn" class="signup-btn" style="width:100%;">이 대화를 사서(DB)에 기록하기</button>

        <div class="history-list">
            <h3>나의 사초 (기록 보관소)</h3>
            <div id="dataList"></div>
        </div>
    </section>
</div>

<script type="module">
    /* Firebase 및 라이브러리 임포트 [1, 13] */
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // Firebase 설정 [1]
    const firebaseConfig = {
        apiKey: "AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo",
        authDomain: "kang-f4e85.firebaseapp.com",
        databaseURL: "https://kang-f4e85-default-rtdb.firebaseio.com",
        projectId: "kang-f4e85",
        storageBucket: "kang-f4e85.firebasestorage.app",
        messagingSenderId: "107057126084",
        appId: "1:107057126084:web:30f7bcb3f25dd2aa4a0791"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Google Apps Script URL [14, 15]
    const CHAT_URL = "https://script.google.com/macros/s/AKfycbxTmD_aKFktnu5BcmOj0x84D15A5qOEkAbpoyJ7DEGzJR7UayIGwKLDL7nFhU3hbB_wVw/exec";
    const TTS_URL = "https://script.google.com/macros/s/AKfycbxzvCeCidpIBm3Ez_AbmzTRrvzCkPa_7x-irAazDPzljPmuqjjHZOqXxfyS1vNh7tX1/exec";

    /* 인증 로직 [16-19] */
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    let currentUser = null;

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const email = document.getElementById('emailInput').value;
        const pw = document.getElementById('passwordInput').value;
        try { await createUserWithEmailAndPassword(auth, email, pw); alert("사관 등록 완료!"); }
        catch(e) { alert(e.message); }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('emailInput').value;
        const pw = document.getElementById('passwordInput').value;
        try { await signInWithEmailAndPassword(auth, email, pw); }
        catch(e) { alert("로그인 실패: " + e.message); }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            authSection.classList.add('hidden');
            mainSection.classList.remove('hidden');
            document.getElementById('userEmail').textContent = user.email;
            loadHistory(user.uid);
        } else {
            authSection.classList.remove('hidden');
            mainSection.classList.add('hidden');
        }
    });

    /* AI 인터뷰 및 TTS 로직 [20-25] */
    document.getElementById('askBtn').addEventListener('click', async () => {
        const question = document.getElementById('questionInput').value;
        const persona = document.getElementById('personaSelect').value;
        if(!question) return alert("질문을 입력하세요.");

        document.getElementById('status').textContent = "인물이 답변을 생각 중입니다...";
        
        try {
            // GPT 질문 전송 (Persona 포함)
            const chatRes = await fetch(CHAT_URL, {
                method: 'POST',
                body: JSON.stringify({ question: `프롬프트: 너는 ${persona}. 질문: ${question}` })
            });
            const chatData = await chatRes.json();
            const answer = chatData.answer;
            document.getElementById('answerBox').textContent = answer;

            // TTS 변환 요청 [24]
            document.getElementById('status').textContent = "목소리를 생성 중입니다...";
            const ttsRes = await fetch(TTS_URL, {
                method: 'POST',
                body: JSON.stringify({ type: 'tts', text: answer, voice: 'onyx' }) // 왕의 목소리 onyx
            });
            const ttsData = await ttsRes.json();
            if(ttsData.audioBase64) {
                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.src = `data:audio/mpeg;base64,${ttsData.audioBase64}`;
                audioPlayer.classList.remove('hidden');
                audioPlayer.play();
            }
            document.getElementById('status').textContent = "인터뷰 완료.";
        } catch(e) {
            alert("오류 발생: " + e.message);
        }
    });

    /* 데이터베이스 기록 (CRUD) [26-31] */
    document.getElementById('saveBtn').addEventListener('click', async () => {
        if(!currentUser) return;
        const answer = document.getElementById('answerBox').textContent;
        const persona = document.getElementById('personaSelect').selectedOptions.text;
        
        const historyRef = ref(database, `users/${currentUser.uid}/history`);
        await push(historyRef, {
            persona,
            content: answer,
            timestamp: new Date().toLocaleString()
        });
        alert("사서에 기록되었습니다.");
    });

    function loadHistory(uid) {
        const historyRef = ref(database, `users/${uid}/history`);
        onValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            const listDiv = document.getElementById('dataList');
            listDiv.innerHTML = "";
            if(data) {
                Object.entries(data).reverse().forEach(([id, item]) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'history-item';
                    itemDiv.innerHTML = `
                        <strong>[${item.persona}]</strong> <small>${item.timestamp}</small>
                        <p>${item.content}</p>
                        <button onclick="deleteRecord('${id}')" style="background:#ef5350; color:white; height:30px; padding:0 10px;">삭제</button>
                    `;
                    listDiv.appendChild(itemDiv);
                });
            }
        });
    }

    window.deleteRecord = (id) => {
        if(confirm("이 기록을 삭제하시겠습니까?")) {
            remove(ref(database, `users/${currentUser.uid}/history/${id}`));
        }
    };
</script>
</body>
</html>

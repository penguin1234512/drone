<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>북방의 역사 AI 역사 인터뷰 & TTS</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1a237e;
    }

    .subtitle {
      text-align: center;
      color: #546e7a;
      margin-bottom: 24px;
      font-size: 14px;
    }

    /* 인증(Auth) 박스 스타일 */
    .auth-container {
      max-width: 400px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .auth-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .auth-box input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .auth-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .auth-btn-row button {
      flex: 1;
    }

    /* 사용자 프로필 바 */
    .user-profile-bar {
      background: #e8eaf6;
      padding: 12px 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .info {
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 3열 옵션 배치 */
    .option-box {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    select, input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      font-family: Arial, sans-serif;
    }

    textarea:focus, select:focus, input:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    .label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 15px;
      color: #263238;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, .download-link {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .download-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .make-btn { background: #42a5f5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .refresh-btn { background: #66bb6a; color: white; margin-bottom: 16px; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }
    .login-btn { background: #1a237e; color: white; }
    .signup-btn { background: #eceff1; color: #37474f; border: 1px solid #cfd8dc; }
    .logout-btn { background: #e53935; color: white; height: 34px; padding: 0 12px; font-size: 12px; }
    .download-link { background: #00acc1; color: white; }

    .hidden { display: none !important; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: #3949ab;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      background: #f0f4c3;
      padding: 8px;
      border-radius: 8px;
    }

    .result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .chat-display {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 8px;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    audio { width: 100%; margin-top: 10px; }
    .list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
      
    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title { margin: 0 0 6px; font-size: 17px; font-weight: bold; color: #1a237e; }
    .item-content { margin: 0; color: #455a64; line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 11px; color: #90a4ae; }
    .item-actions { display: flex; gap: 8px; }
    .edit-box { display: grid; grid-template-columns: 1fr 2fr auto auto; gap: 8px; width: 100%; }
    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }

    @media (max-width: 900px) {
      .option-box { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      .option-box, .edit-box { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
      .button-row, .item-actions { justify-content: stretch; }
      button, .download-link { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="authContainer" class="auth-container">
    <h2 style="color:#1a237e; margin-bottom:5px;">사관 청사 입정</h2>
    <p style="font-size:12px; color:#666; margin-bottom:20px;">역사를 기록하기 위해 인증이 필요합니다.</p>
    <div class="auth-box">
      <input id="authEmail" type="email" placeholder="이메일 주소 (example@email.com)" />
      <input id="authPassword" type="password" placeholder="비밀번호 (6자리 이상)" />
      <div class="auth-btn-row">
        <button class="signup-btn" id="signUpBtn">회원가입</button>
        <button class="login-btn" id="logInBtn">로그인</button>
      </div>
    </div>
  </div>

  <div id="mainContainer" class="container hidden">
    <h1>북방의 거인들</h1>
    <div class="subtitle">고구려와 발해의 영웅들을 AI 인터뷰와 맞춤형 음성으로 만나다</div>

    <div class="user-profile-bar">
      <div>접속 사관: <strong id="currentUserEmail" style="color:#1a237e;">-</strong></div>
      <button class="logout-btn" id="logOutBtn">로그아웃</button>
    </div>

    <div class="info">
      역사적 인물과 **TTS 세부 옵션(모델, 목소리, 속도)**을 고르고 질문을 입력하세요.<br />
      완성된 답변은 아래 '사초(역사 기록)' 보관소에 안전하게 기록(Firebase DB)하고 관리할 수 있습니다.
    </div>

    <div class="option-box">
      <div>
        <div class="label">인터뷰 대상 선택</div>
        <select id="personaSelect">
          <option value="고구려의 광개토대왕이야. 위엄 있고 당당한 말투로 고구려의 기상과 영토 확장에 대해 답변해줘.">고구려 - 광개토대왕</option>
          <option value="발해를 건국한 대조영이야. 고구려를 계승한 자부심을 담아 완강하고 굳건하게 답변해줘.">발해 - 대조영</option>
        </select>
      </div>
      <div>
        <div class="label">음성 모델 품질</div>
        <select id="modelSelect">
          <option value="tts-1">tts-1 빠른 생성</option>
          <option value="tts-1-hd">tts-1-hd 고품질</option>
        </select>
      </div>
      <div>
        <div class="label">AI 목소리 선택</div>
        <select id="voiceSelect">
          <option value="onyx" selected>onyx (중후한 남성)</option>
          <option value="alloy">alloy (기본 중성)</option>
          <option value="echo">echo (기개 있는 남성)</option>
          <option value="fable">fable (서사적인 음색)</option>
          <option value="nova">nova (밝은 여성)</option>
          <option value="shimmer">shimmer (단호한 여성)</option>
        </select>
      </div>
      <div>
        <div class="label">말투 속도</div>
        <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" placeholder="속도" />
      </div>
    </div>

    <div>
      <div class="label">인물에게 보낼 질문</div>
      <textarea id="questionInput" placeholder="역사 속 주인공에게 궁금한 점을 질문하세요... (예: 백성을 다스릴 때 가장 중요하게 생각한 가치는 무엇입니까?)"></textarea>
    </div>

    <div class="button-row">
      <button class="clear-btn" id="clearBtn">초기화</button>
      <button class="make-btn" id="makeBtn">질문 전송 및 음성 듣기</button>
    </div>

    <div id="status" class="status">시스템 로딩 중...</div>

    <div id="resultBox" class="result-box hidden">
      <div class="label" id="answerTitle">인터뷰 답변 기록</div>
      <div id="answerBox" class="chat-display"></div>
      <audio id="audioPlayer" controls></audio>
      <div class="button-row">
        <a id="downloadLink" class="download-link hidden" href="#" download="interview.mp3">mp3 다운로드</a>
        <button class="save-btn" id="saveBtn">이 대화를 사초(DB)에 기록하기</button>
      </div>
    </div>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #cfd8dc;" />

    <div>
      <h3 style="color:#1a237e; margin-bottom:10px;">나의 사초 (역사 기록 보관소)</h3>
      <button class="refresh-btn" id="refreshBtn">사초 새로고침</button>
      <div id="dataList" class="list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      push,
      set,
      update,
      remove,
      onValue,
      off
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // UI 요소 정의
    const statusBox = document.getElementById('status');
    const authContainer = document.getElementById('authContainer');
    const mainContainer = document.getElementById('mainContainer');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const signUpBtn = document.getElementById('signUpBtn');
    const logInBtn = document.getElementById('logInBtn');
    const logOutBtn = document.getElementById('logOutBtn');
    const currentUserEmail = document.getElementById('currentUserEmail');

    const questionInput = document.getElementById('questionInput');
    const personaSelect = document.getElementById('personaSelect');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const makeBtn = document.getElementById('makeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const resultBox = document.getElementById('resultBox');
    const answerBox = document.getElementById('answerBox');
    const answerTitle = document.getElementById('answerTitle');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const dataList = document.getElementById('dataList');

    let auth;
    let database;
    let analytics;
    let currentAnswerText = ""; 
    let currentUser = null;
    let currentItemsRef = null;

    // Firebase 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyDTKTX3tTAaSAecMkvEzevbuRQmwuRaDWo",
      authDomain: "suhang-86f3f.firebaseapp.com",
      databaseURL: "https://suhang-86f3f-default-rtdb.firebaseio.com",
      projectId: "suhang-86f3f",
      storageBucket: "suhang-86f3f.firebasestorage.app",
      messagingSenderId: "412517168949",
      appId: "1:412517168949:web:26766fd1b37b3fbd4f7e7c",
      measurementId: "G-YDVD63CF7H"
    };
    
    // Firebase 초기화 및 안전 가드 장치
    try {
      const app = initializeApp(firebaseConfig);
      
      try {
        analytics = getAnalytics(app);
      } catch (e) {
        console.warn("Analytics 초기화 건너뜀 (로컬 파일 실행 등):", e.message);
      }

      auth = getAuth(app);
      database = getDatabase(app);
      statusBox.textContent = 'Firebase 시스템 정상 연동됨. 청사 입장 대기 중.';
      
      // 실시간 유저 인증 모니터 관측기 활성화
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          currentUserEmail.textContent = user.email;
          authContainer.classList.add('hidden');
          mainContainer.classList.remove('hidden');
          authEmail.value = '';
          authPassword.value = '';
          startRealtimeDataListener(user.uid);
        } else {
          currentUser = null;
          authContainer.classList.remove('hidden');
          mainContainer.classList.add('hidden');
          currentUserEmail.textContent = '-';
          dataList.innerHTML = '';
          stopRealtimeDataListener();
        }
      });

    } catch (initError) {
      statusBox.textContent = `CRITICAL: Firebase 연동 실패! 원인: ${initError.message}`;
      alert(`[초기화 에러] Firebase 연결 설정 오류:\n${initError.message}\n\nconfig 값이 올바른지 콘솔 설정을 검토하세요.`);
    }

    // Google Apps Script 웹 앱 URL 반영
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiX2qKYv8ETP6ho_wnuny72bPO_6ulhF61Oh9u5Tk3paXht7tQDVGuqDHoxcHGj1QGkQ/exec';

    function getAuthInputs() {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return null;
      }
      if (password.length < 6) {
        alert('비밀번호는 6자리 이상이어야 안전합니다.');
        return null;
      }
      return { email, password };
    }

    /* 🔐 [Auth] 회원가입 */
    signUpBtn.addEventListener('click', async () => {
      if (!auth) { alert('인증 시스템이 초기화되지 않았습니다.'); return; }
      const credentials = getAuthInputs();
      if (!credentials) return;
      try {
        statusBox.textContent = '회원가입 요청 중...';
        await createUserWithEmailAndPassword(auth, credentials.email, credentials.password);
        alert('사관 명부에 등록(회원가입)되었습니다');
      } catch (error) {
        const koMsg = getKoreanErrorMessage(error.code || error.message);
        statusBox.textContent = `회원가입 실패: ${koMsg}`;
        alert(`회원가입 오류: ${koMsg}\n[상세 에러코드: ${error.code || error.message}]`);
      }
    });

    /* 🔐 [Auth] 로그인 */
    logInBtn.addEventListener('click', async () => {
      if (!auth) { alert('인증 시스템이 초기화되지 않았습니다.'); return; }
      const credentials = getAuthInputs();
      if (!credentials) return;
      try {
        statusBox.textContent = '로그인 승인 요청 중...';
        await signInWithEmailAndPassword(auth, credentials.email, credentials.password);
      } catch (error) {
        const koMsg = getKoreanErrorMessage(error.code || error.message);
        statusBox.textContent = `로그인 실패: ${koMsg}`;
        alert(`로그인 오류: ${koMsg}\n[상세 에러코드: ${error.code || error.message}]`);
      }
    });

    /* 🔐 [Auth] 로그아웃 */
    logOutBtn.addEventListener('click', async () => {
      if (!auth) return;
      try {
        await signOut(auth);
        clearPage();
        statusBox.textContent = '로그아웃 되었습니다.';
      } catch (error) {
        alert(`로그아웃 오류: ${error.message}`);
      }
    });

    /* 📜 DB 실시간 연동 리스너 규칙 */
    function startRealtimeDataListener(uid) {
      if (!database) return;
      stopRealtimeDataListener();
      statusBox.textContent = '사초(DB) 기록을 동기화하는 중...';

      currentItemsRef = ref(database, `users/${uid}/items`);

      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        statusBox.textContent = '실시간 동기화 완료.';
      }, (error) => {
        console.error(error);
        statusBox.textContent = `DB 연동 실패: ${error.message}`;
        alert(`Firebase DB 에러: ${error.message}\nRealtime Database 규칙(Rules) 탭에서 접근 권한 설정을 점검해 보십시오.`);
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef && database) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    makeBtn.addEventListener('click', startInterview);
    clearBtn.addEventListener('click', clearPage);
    saveBtn.addEventListener('click', addFirebaseData);
    refreshBtn.addEventListener('click', () => {
      if (currentUser) startRealtimeDataListener(currentUser.uid);
    });

    /* 📜 코어 기능: 인물 인터뷰 시스템 호출 + 세부 TTS 파라미터 전송 연동 */
    async function startInterview() {
      if (!currentUser) { alert('로그인이 만료되었습니다.'); return; }
      if (!database) { alert('데이터베이스 인스턴스가 존재하지 않습니다.'); return; }
      
      const question = questionInput.value.trim();
      const persona = personaSelect.value;
      const selectedName = personaSelect.options[personaSelect.selectedIndex].text;
      
      const model = modelSelect.value;
      const voice = voiceSelect.value;
      const speed = Number(speedInput.value || 1.0);

      if (!question) { alert('질문 내용을 빈칸 없이 적어주세요.'); return; }
      if (speed < 0.25 || speed > 4.0) { alert('속도는 0.25부터 4.0 사이로 입력해주세요.'); return; }

      audioPlayer.removeAttribute('src');
      audioPlayer.classList.add('hidden');
      downloadLink.classList.add('hidden');

      // 1단계: 질문 임시 저장 보존
      try {
        setLoading(true);
        resultBox.classList.add('hidden');
        statusBox.textContent = '사초에 질문 서두를 작성 중...';
        
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);
        await set(newItemRef, {
          title: `${selectedName}에 대한 질문`,
          content: `[질문 본문]: ${question}\n(※ AI 답변 대기 중 또는 예기치 못한 에러 상태)`,
          createdAt: new Date().toLocaleString('ko-KR'),
          updatedAt: ''
        });
      } catch (fbError) { 
        console.error("임시 백업 실패", fbError); 
        statusBox.textContent = `DB 기록 실패: ${fbError.message}`;
      }

      // 2단계: AI 챗봇 교신
      try {
        statusBox.textContent = `${selectedName} 장군에게 밀서를 발송했습니다...`;

        const chatResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ type: 'chat', persona: persona, question: question })
        });

        if (!chatResponse.ok) throw new Error(`네트워크 응답 오류 (상태코드: ${chatResponse.status})`);

        const chatData = await chatResponse.json();
        if (chatData.error) throw new Error(`Apps Script 에러: ${chatData.error}`);
        if (!chatData.answer) throw new Error('서버로부터 답변 데이터를 받지 못했습니다.');

        currentAnswerText = chatData.answer;
        answerTitle.textContent = `📜 ${selectedName}의 답변`;
        answerBox.textContent = currentAnswerText;

        // 3단계: TTS 음성 변환 호출
        statusBox.textContent = '선택하신 AI 목소리로 음성을 복원하는 중입니다...';
        const ttsResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ 
            type: 'tts', 
            text: currentAnswerText, 
            model: model, 
            voice: voice, 
            speed: speed 
          })
        });

        if (!ttsResponse.ok) throw new Error(`TTS 서버 통신 오류 (상태코드: ${ttsResponse.status})`);

        const ttsData = await ttsResponse.json();
        if (ttsData.error) throw new Error(`Apps Script TTS 에러: ${ttsData.error}`);
        
        if (ttsData.audioBase64) {
          const audioUrl = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');
          audioPlayer.src = audioUrl;
          audioPlayer.classList.remove('hidden');
          downloadLink.href = audioUrl;
          downloadLink.download = makeFileName(selectedName);
          downloadLink.classList.remove('hidden');
          audioPlayer.play();
        } else {
          throw new Error('음성 데이터(Base64)가 유실되어 수신되었습니다.');
        }

        resultBox.classList.remove('hidden');
        statusBox.textContent = '대화 기록과 전용 목소리가 복원되었습니다.';
      } catch (error) {
        console.error(error);
        statusBox.textContent = `❌ 통신 차단됨: ${error.message}`;
        alert(`교신 오류 발생!\n\n원인: ${error.message}\n\n구글 앱스 스크립트 '배포 관리' 주소 상태를 재점검하세요.`);
        
        currentAnswerText = `[시스템 피드백]: 통신 및 실행 오류.\n원인: ${error.message}\n\n질문하려던 내용:\n${question}`;
        answerTitle.textContent = `⚠️ 통신 차단 (${selectedName})`;
        answerBox.textContent = currentAnswerText;
        resultBox.classList.remove('hidden');
      } finally {
        document.getElementById('refreshBtn').click(); 
        setLoading(false);
      }
    }

    /* 📜 답변을 사초 보관소에 최종 정식 저장 */
    async function addFirebaseData() {
      if (!currentUser || !database) return;
      const selectedName = personaSelect.options[personaSelect.selectedIndex].text;
      if (!currentAnswerText) return;

      try {
        statusBox.textContent = '사초 기록 보관소 수록 중...';
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);

        await set(newItemRef, {
          title: selectedName, 
          content: currentAnswerText, 
          createdAt: new Date().toLocaleString('ko-KR'),
          updatedAt: ''
        });
        alert('역사 보관소(Realtime DB)에 안전하게 추가 기록되었습니다.');
      } catch (error) { 
        alert(`Firebase 저장 오류: ${error.message}`); 
        statusBox.textContent = `저장 실패: ${error.message}`;
      }
    }

    /* 📜 기록 삭제 */
    window.deleteData = async function(id) {
      if (!currentUser || !database) return;
      if (!confirm('해당 기록을 영구히 사삭(삭제)하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (error) { alert(`삭제 실패: ${error.message}`); }
    };

    /* 📜 기록 수정 */
    window.updateData = async function(id) {
      if (!currentUser || !database) return;
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();

      if (!editTitle || !editContent) { alert('수정 내용을 입력해주세요.'); return; }

      try {
        await update(ref(database, `users/${currentUser.uid}/items/${id}`), {
          title: editTitle,
          content: editContent,
          updatedAt: new Date().toLocaleString('ko-KR')
        });
      } catch (error) { alert(`수정 변경 실패: ${error.message}`); }
    };

    /* 📜 화면 렌더링 그리기 */
    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) { dataList.innerHTML = '<div class="empty">아직 보관된 기록이 없습니다.</div>'; return; }

      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">기록일: ${item.createdAt || '-'} ${item.updatedAt ? ` / 수정일: ${item.updatedAt}` : ''}</div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    window.showEditForm = function(id, title, content) {
      const itemBox = document.getElementById(`item-${id}`);
      itemBox.innerHTML = `
        <div class="edit-box">
          <input id="edit-title-${id}" type="text" value="${title}" />
          <input id="edit-content-${id}" type="text" value="${content}" />
          <button class="save-btn" onclick="updateData('${id}')">저장</button>
          <button class="cancel-btn" onclick="document.getElementById('refreshBtn').click()">취소</button>
        </div>
      `;
    };

    function base64ToAudioUrl(base64, mimeType) {
      try {
        const byteCharacters = atob(base64);
        const byteArrays = [];
        for (let offset = 0; offset < byteCharacters.length; offset += 512) {
          const slice = byteCharacters.slice(offset, offset + 512);
          const byteNumbers = new Array(slice.length);
          for (let i = 0; i < slice.length; i++) { byteNumbers[i] = slice.charCodeAt(i); }
          byteArrays.push(new Uint8Array(byteNumbers));
        }
        return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
      } catch (e) {
        alert(`오디오 인코딩 디코딩 에러: ${e.message}`);
        return '';
      }
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function escapeForAttribute(text) { return escapeHTML(text).replaceAll('`', '&#096;'); }
    
    function setLoading(isLoading) {
      makeBtn.disabled = isLoading;
      makeBtn.textContent = isLoading ? '전령 교신 중...' : '질문 전송 및 음성 듣기';
    }

    function makeFileName(name) {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hour = String(now.getHours()).padStart(2, '0');
      const minute = String(now.getMinutes()).padStart(2, '0');
      return `interview-${name}-${year}${month}${day}-${hour}${minute}.mp3`;
    }

    function clearPage() {
      questionInput.value = '';
      statusBox.textContent = '시스템 대기 중...';
      currentAnswerText = "";
      audioPlayer.removeAttribute('src');
      audioPlayer.classList.add('hidden');
      downloadLink.href = '#';
      downloadLink.classList.add('hidden');
      resultBox.classList.add('hidden');
    }

    function getKoreanErrorMessage(code) {
      if (!code) return '알 수 없는 오류';
      if (code.includes('auth/email-already-in-use')) return '이미 가입된 이메일입니다.';
      if (code.includes('auth/invalid-email')) return '이메일 형식이 올바르지 않습니다.';
      if (code.includes('auth/weak-password')) return '비밀번호가 너무 약합니다. 6자리 이상으로 입력해주세요.';
      if (code.includes('auth/user-not-found')) return '가입되지 않은 이메일입니다.';
      if (code.includes('auth/wrong-password')) return '비밀번호가 올바르지 않습니다.';
      if (code.includes('auth/invalid-credential')) return '이메일 또는 비밀번호가 올바르지 않습니다.';
      if (code.includes('auth/network-request-failed')) return '네트워크 연결 상태를 확인해주세요.';
      if (code.includes('auth/operation-not-allowed')) return 'Firebase 콘솔에서 이메일/비밀번호 로그인 활성화가 꺼져있습니다.';
      return `인증 오류가 발생했습니다: ${code}`;
    }

    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;
      const activeId = document.activeElement.id;
      if (activeId === 'authEmail' || activeId === 'authPassword') {
        logInBtn.click();
      }
    });
  </script>
</body>
